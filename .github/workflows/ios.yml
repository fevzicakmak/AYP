name: iOS Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install deps
        run: npm install --legacy-peer-deps || npm install
        
      - name: Sync iOS
        run: |
          npx cap sync ios || (npx cap add ios && npx cap sync ios)
          
      - name: Pod install
        run: |
          cd ios/App
          pod install --repo-update || pod install
          cd ../..
          
      - name: Build without signing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -sdk iphoneos -destination "generic/platform=iOS" build
