workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        BUNDLE_ID: "com.apartman.yonetim"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install
        script: |
          npm install
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install || true
          cd ../..
      - name: Init keychain
        script: |
          keychain initialize
      - name: Fetch & Create Profile
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
      - name: Add certs
        script: |
          keychain add-certificates
      - name: Use profiles
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: Codemagic
        submit_to_testflight: true
