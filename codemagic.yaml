workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.apartman.yonetim"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install
        script: |
          npm install || true
          npm i -g @capacitor/cli
      - name: Setup iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install || true
          cd ../..
      - name: Keychain
        script: |
          keychain initialize
      - name: Create profile automatically
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
      - name: Add cert
        script: |
          keychain add-certificates
      - name: Use profile
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: Codemagic
        submit_to_testflight: true
