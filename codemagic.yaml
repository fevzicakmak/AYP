workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.apartman.yonetim"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install
        script: |
          npm install || true
          npm i -g @capacitor/cli
      - name: Setup iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install || true
          cd ../..
      - name: Init keychain
        script: |
          keychain initialize
      - name: Create profile automatically
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --platform IOS
      - name: Add certs
        script: |
          keychain add-certificates
      - name: Use profiles
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        api_key: Codemagic
        submit_to_testflight: true
