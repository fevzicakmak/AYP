workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.apartman.yonetim
    scripts:
      - name: Install Node dependencies
        script: |
          npm install || true
          npm install -g @capacitor/cli || true
      - name: Setup Capacitor iOS
        script: |
          npx cap add ios || true
          npx cap sync ios || true
          pod install --project-directory=ios/App || true
      - name: Set up code signing
        script: |
          xcode-project use-profiles
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        api_key: Codemagic
        submit_to_testflight: true
        submit_to_app_store: false
