workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.apartman.yonetim"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install || true
          npm install -g @capacitor/cli || true
      - name: Setup iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install || true
          cd ../..
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files (auto create)
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --platform IOS
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: Codemagic
        submit_to_testflight: true
        submit_to_app_store: false
